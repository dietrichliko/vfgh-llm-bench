[project]
name = "bench"
version = "0.0.0"
description = "Web application for the study whether LLMs reason like the Austrian Constitutional Court"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pydantic-ai-slim[openai,mcp]>=1.0",
    "httpx>=0.27",
    "authlib>=1.3",
    "pyyaml>=6",
    "pypdf>=6.21.4",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.7",
    "mypy>=1.19",
    "types-pyyaml>=6.0",
    "commitizen>=4.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# German legal texts: dashes and quotation marks are intended
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# fixtures imported from another test module are redefined as test parameters
"tests/test_normsets.py" = ["F811"]
"tests/test_checklists.py" = ["F811"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"  # updates pyproject.toml and uv.lock
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true  # stays 0.x until the study release
