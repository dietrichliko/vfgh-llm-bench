name: Release

# A release is `uv run cz bump && git push --follow-tags` (see README). The tag vX.Y.Z:
# 1. checks that it matches pyproject.toml and that CHANGELOG.md has its section,
# 2. runs the CI checks (ci.yml),
# 3. pushes the image to ghcr.io under its commit tag only, smoke-tests exactly that image
#    by digest, then adds the version tags to the same digest (no rebuild),
# 4. creates the GitHub release with the changelog section and the digest.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Tag and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME, pyproject.toml $version"; exit 1; }
      - name: Changelog section
        run: |
          test -f CHANGELOG.md || { echo "::error::CHANGELOG.md missing (use cz bump)"; exit 1; }
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; if (index($0, "## " tag " ") == 1) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || {
            echo "::error::no section '## $GITHUB_REF_NAME' in CHANGELOG.md (use cz bump)"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Image and GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the GitHub release
      packages: write  # ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false  # no floating tag: deployments name a version or digest
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
      - id: build
        name: Build and push under the commit tag
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
      - name: Smoke test the pushed image
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$REF"
          docker run --rm "$REF" bench --help
          docker run --rm "$REF" git --version
          test "$(docker run --rm "$REF" printenv BENCH_GIT_COMMIT)" = "$GITHUB_SHA"
          test "$(docker run --rm "$REF" python -c 'import bench; print(bench.__version__)')" = "${GITHUB_REF_NAME#v}"
          docker run --rm -e BENCH_DATA_DIR=/tmp/data "$REF" sh -c 'mkdir -p /tmp/data && bench migrate'
      - name: Add the version tags to the tested digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          args=()
          for t in $TAGS; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
      - uses: actions/download-artifact@v8
        with:
          name: notes
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo
            echo "**Image:** \`$IMAGE@$DIGEST\`"
            echo
            echo "Tags: $(for t in $TAGS; do printf '`%s` ' "${t#"$IMAGE":}"; done)\`sha-$GITHUB_SHA\`."
            echo "When deploying this image, set \`BENCH_IMAGE_DIGEST=$DIGEST\`."
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
