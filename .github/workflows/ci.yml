name: CI

on:
  push:
    branches: ["**"]  # tags run release.yml, which calls this workflow first
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; bump by hand
      - name: Install
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Mypy
        run: uv run mypy src tests
      - name: Tests
        run: uv run pytest -q

  image:
    name: Container image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: bench:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max  # shared with release.yml
      - name: Smoke test
        run: |
          docker run --rm bench:ci bench --help
          docker inspect --format '{{json .Config.Healthcheck}}' bench:ci | grep -q /health
          docker run --rm bench:ci git --version
          docker run --rm bench:ci ssh -V
          test "$(docker run --rm bench:ci printenv BENCH_GIT_COMMIT)" = "${{ github.sha }}"
          docker run --rm -e BENCH_DATA_DIR=/tmp/data bench:ci \
            sh -c 'mkdir -p /tmp/data && bench migrate'
